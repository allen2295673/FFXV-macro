<!DOCTYPE html>
<html lang="zh-TW">

    <style>
        .code-block {
            position: relative;

            border: 1px solid #d0d7de;
            border-radius: 6px;
            padding: 16px;
            max-width: 500px;
            margin-bottom: 20px; /* 區塊之間的間距 */
            font-family: Consolas, Monaco, 'Courier New', monospace;
        }

        .copy-icon {
            position: absolute;
            top: 10px;
            right: 10px;
            cursor: pointer;
            padding: 6px;
            border-radius: 4px;
            color: #57606a;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, color 0.2s;
        }

        .copy-icon:hover {
            background-color: #eaeeef;
            color: #24292f;
        }

        pre {
            margin: 0;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.5;
            color: #24292f;
        }
    </style>
