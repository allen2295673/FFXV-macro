<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>探索任務 A1-3</title>
    <style>
		body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        .note {
            background-color: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 10px;
            margin: 15px 0;
        }
        a {
            color: #0066cc;
            font-weight: bold;
        }
        .code-block {
            position: relative;
            background-color: #f6f8fa;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            padding: 16px;
            max-width: 500px;
            margin-bottom: 20px; /* 區塊之間的間距 */
            font-family: Consolas, Monaco, 'Courier New', monospace;
        }

        .copy-icon {
            position: absolute;
            top: 10px;
            right: 10px;
            cursor: pointer;
            padding: 6px;
            border-radius: 4px;
            color: #57606a;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, color 0.2s;
        }

        .copy-icon:hover {
            background-color: #eaeeef;
            color: #24292f;
        }

        pre {
            margin: 0;
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.5;
            color: #24292f;
        }
		/* 摺疊選單樣式 */
        details {
            margin-bottom: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 10px 15px;
            background-color: #fafafa;
        }
		/* 表格樣式 */
        .stat-table {
            border-collapse: collapse;
            width: 100%;
            max-width: 400px;
            margin: 10px 0 15px 0;
            text-align: center;
            background-color: #fff;
        }

        .stat-table th, .stat-table td {
            border: 1px solid #ccc;
            padding: 8px 12px;
            font-size: 15px;
        }

        .stat-table th {
            background-color: #f5f5f5;
            font-weight: normal;
            color: #333;
        }

        ul.macro-list {
            list-style-type: none;
            padding-left: 10px;
            margin-top: 10px;
        }

        ul.macro-list > li {
            margin-bottom: 20px;
        }
		h1 {
        font-size: 28px;       /* 文字大小 */
        color: #1a0dab;        /* 文字顏色 */
        margin-bottom: 15px;   /* 下方間距 */
        border-bottom: 2px solid #0066cc; /* 標題底線（可自由選用） */
        padding-bottom: 5px;
		}

		h2 {
			font-size: 22px;
			color: #333333;
			margin-top: 20px;
			margin-bottom: 10px;
		}

		h3 {
			font-size: 18px;
			color: #555555;
			margin-top: 15px;
			margin-bottom: 8px;
		}
		.macro-container {
			display: flex;
			flex-wrap: wrap;
			gap: 20px;
			margin-bottom: 20px;
		}

		.macro-item {
			flex: 1;
			min-width: 280px; /* 控制單個卡片最小寬度 */
			max-width: 500px;
		}
    </style>
</head>
<body>

	</div>
